<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: skyblue;
            width: 300px;
            height: 150px;
            text-align: center;
            border: 2px solid black;
            border: 2px dashed black;
            border: 2px double black;
            border-radius: 15px;
            margin: 20px;
            padding: 15px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Hello Friends</p>
    </div>
    <div class="box">
        <p>I Love Books</p>
    </div>
</body>
</html>
